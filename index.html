<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Arcade — juegos neón gratis en el navegador</title>
<meta name="description" content="Neon Arcade: 12 juegos neón gratis en el navegador y el móvil. Carreras 3D, tiros, tanques, serpientes, fútbol con coches, plataformas, sigilo, misterio, naves, mazmorras y ritmo. Multijugador con amigos por código.">
<meta name="google-site-verification" content="5nXPfou9Nh5STG5obQ0k2jdk1NsMcyLxKBhxOC6qWwE" />
<link rel="canonical" href="https://entrena-casa.github.io/neon-apex/">
<meta property="og:title" content="Neon Arcade — juegos neón gratis">
<meta property="og:description" content="Carreras, tiros, tanques, serpientes, fútbol con coches y aventuras. Solo o con amigos, en el móvil y el PC.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun/neon.css">
<style>
  html,body{overflow:auto;touch-action:auto;height:auto;min-height:100%}
  body{background:radial-gradient(ellipse at 50% -10%,#3a0d6a 0%,#05010f 55%) fixed,#05010f}
  #bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
  header{text-align:center;padding:42px 16px 8px}
  .title{font-size:clamp(46px,12vw,130px)}
  .sub{margin:12px 0 18px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 16px 22px}
  .chip{font-size:11px;letter-spacing:2px;padding:8px 14px;border-radius:20px;border:1.5px solid #3b2a6a;background:#0d0524cc;color:var(--dim);font-weight:700}
  .chip.on{border-color:var(--pink);color:#fff;box-shadow:0 0 14px #ff2bd666;background:#2a0a3a}
  main{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;width:min(1200px,100%);margin:0 auto;padding:0 16px 40px}
  .card{position:relative;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--panel);border:2px solid color-mix(in srgb,var(--c) 45%,#2a1d4a);text-decoration:none;color:#fff;transition:transform .18s,box-shadow .18s;box-shadow:0 0 0 transparent}
  .card:hover,.card:focus-visible{transform:translateY(-4px) scale(1.01);box-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent);outline:none;border-color:var(--c)}
  .card canvas{width:100%;aspect-ratio:16/9;display:block;background:#05010f}
  .card .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .card h2{font-size:18px;letter-spacing:2px;color:var(--c);text-shadow:0 0 10px var(--c)}
  .card p{font-family:system-ui,sans-serif;font-size:13px;color:#cfc0ff;line-height:1.45}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
  .tag{font-size:9px;letter-spacing:2px;padding:4px 8px;border-radius:8px;background:#ffffff12;color:#e8dcff}
  .tag.mp{background:#ffd20022;color:var(--gold)}.tag.st{background:#ff2bd622;color:var(--pink)}.tag.new{background:#39ff8833;color:var(--green)}
  .rec{position:absolute;top:10px;right:10px;font-size:10px;letter-spacing:1px;padding:5px 9px;border-radius:10px;background:#05010fcc;color:var(--gold);border:1px solid #ffd20055}
  .play{position:absolute;left:50%;top:calc(28%);transform:translate(-50%,-50%) scale(.8);opacity:0;transition:.2s;font-size:14px;letter-spacing:3px;padding:10px 20px;border-radius:12px;background:#05010fcc;border:2px solid var(--c);box-shadow:0 0 18px var(--c)}
  .card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}
  footer{text-align:center;font-size:11px;letter-spacing:2px;color:#7a6aa8;padding:10px 16px 40px;line-height:2}
  footer b{color:var(--cyan)}
  .soon{opacity:.55;pointer-events:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<header>
  <h1 class="title" style="--acc:var(--pink)">NEON <span style="text-shadow:0 0 6px #fff,0 0 16px var(--cyan),0 0 40px var(--cyan),0 0 80px var(--cyan)">ARCADE</span></h1>
  <p class="sub">JUEGOS NEÓN · GRATIS · MÓVIL Y PC · CON AMIGOS</p>
</header>
<div class="chips" id="chips">
  <button class="chip on" data-f="all">TODOS</button>
  <button class="chip" data-f="mp">🌐 MULTIJUGADOR</button>
  <button class="chip" data-f="st">📖 CON HISTORIA</button>
  <button class="chip" data-f="ar">🕹 ARCADE</button>
  <button class="chip" data-f="ca">🏎 CARRERAS</button>
</div>
<main id="list"></main>
<footer>Todo se juega en el navegador, sin descargar nada. Tu progreso se guarda en este aparato.<br>En los juegos multijugador: uno crea la sala y los demás entran con el <b>código de 5 letras</b>.</footer>
<script type="module">
import { store } from './comun/lib.js';
const GAMES = [
  { id: 'apex', url: 'apex/', name: 'NEON APEX', c: '#00f0ff', tags: ['ca', 'mp'], desc: 'Carreras 3D con derrapes, miniturbo, rebufo y 10 circuitos. Campeonatos, contrarreloj con fantasma y salas con amigos.', rec: () => { try { const s = JSON.parse(localStorage.getItem('apex.save.v1') || 'null'); return s && s.credits != null ? '◆ ' + s.credits.toLocaleString('es-ES') : ''; } catch (e) { return ''; } } },
  { id: 'arena', url: 'juegos/arena/', name: 'NEON ARENA', c: '#ff2bd6', tags: ['ar', 'mp'], desc: 'Tiros cenitales: todos contra todos u oleadas en equipo con jefes. Armas, escudos y esquivas.', rec: () => { const b = store.get('arena.best', null); return b && b.wave ? 'OLEADA ' + b.wave : ''; } },
  { id: 'tanques', url: 'juegos/tanques/', name: 'TANQUES REBOTE', c: '#39ff88', tags: ['ar', 'mp'], desc: 'Laberinto nuevo cada ronda y balas que rebotan. Un impacto y fuera. 20 misiones o batalla con amigos.', rec: () => { const b = store.get('tanques.prog', null); return b && b.lvl > 1 ? 'MISIÓN ' + b.lvl : ''; } },
  { id: 'snake', url: 'juegos/snake/', name: 'SNAKE ROYALE', c: '#ffd200', tags: ['ar', 'mp'], desc: 'Come luz, crece y corta el paso a las demás. Turbo, bots listos y royale de 3 minutos con amigos.', rec: () => { const b = store.get('snake.best', null); return b && b.len ? '📏 ' + b.len : ''; } },
  { id: 'futbol', url: 'juegos/futbol/', name: 'FÚTBOL COCHES', c: '#ff8a1a', tags: ['ar', 'mp'], desc: 'Fútbol con coches neón: turbo, impulsos y golazos. Liga de 8 jornadas o partidos con amigos.', rec: () => { const b = store.get('futbol.liga', null); return b && b.cups ? '🏆 ' + b.cups : ''; } },
  { id: 'eco', url: 'juegos/eco/', name: 'ECO', c: '#39ff88', tags: ['st'], desc: 'Plataformas entre dos épocas: salta entre 2045 y 2077 (¡también en el aire!) para encontrar a tu hermana Lía. 10 niveles y 3 finales.', rec: () => { const b = store.get('eco.save', null); return b && b.done && b.done.length ? 'NIVEL ' + b.done.length + '/10' : ''; } },
  { id: 'turno', url: 'juegos/turno/', name: 'ÚLTIMO TURNO', c: '#ff8a1a', tags: ['st'], desc: 'Sigilo: eres la última repartidora en una ciudad de robots. Esquiva sus miradas, usa el pulso y vence al Centinela.', rec: () => { const b = store.get('turno.save', null); return b && b.stars ? '★ ' + Object.values(b.stars).reduce((a, c) => a + c, 0) : ''; } },
  { id: 'faro', url: 'juegos/faro/', name: 'FARO 13', c: '#00f0ff', tags: ['st'], desc: 'Misterio en una isla: explora el faro, resuelve puzles y descubre qué le pasó al abuelo Elías. Varios finales.', rec: () => { const b = store.get('faro.save', null); return b && b.pages && b.pages.length ? '📜 ' + b.pages.length + '/5' : ''; } },
  { id: 'orbita', url: 'juegos/orbita/', name: 'ÓRBITA ROTA', c: '#9d4dff', tags: ['st', 'ar'], desc: 'Misiones espaciales: recoge chatarra, mejora la nave en el taller, sobrevive a tormentas de asteroides y vence a Halcón.', rec: () => { const b = store.get('orbita.save', null); return b && b.unlocked > 1 ? 'MISIÓN ' + Math.min(6, b.unlocked) : ''; } },
  { id: 'dungeon', url: 'juegos/dungeon/', name: 'DUNGEON NEÓN', c: '#39ff88', tags: ['st'], desc: 'Mazmorras por turnos: 10 pisos aleatorios, monstruos, tesoros, tienda, subidas de nivel y el Rey de las Sombras.', rec: () => { const b = store.get('dungeon.best', null); return b && b.floor ? 'PISO ' + b.floor : ''; } },
  { id: 'pulso', url: 'juegos/pulso/', name: 'PULSO', c: '#ff2bd6', tags: ['ar'], desc: 'Esquiva láseres, muros y bombas al ritmo de la música. 5 canciones synthwave, cada una más rápida.', rec: () => { const b = store.get('pulso.save', null); return b && b.unlocked > 1 ? 'NIVEL ' + Math.min(5, b.unlocked) : ''; } },
  { id: 'rider', url: 'https://entrena-casa.github.io/neon-heist/', name: 'NEON RIDER', c: '#9d4dff', tags: ['ca', 'mp'], desc: 'Mundo abierto en moto neón: carreras callejeras, garajes, policía, bandas y multijugador.' },
];
const NEW = ['arena', 'tanques', 'snake', 'futbol', 'eco', 'turno', 'faro', 'orbita', 'dungeon', 'pulso'];
const list = document.getElementById('list');
for (const g of GAMES) {
  const a = document.createElement('a'); a.className = 'card'; a.href = g.url; a.style.setProperty('--c', g.c); a.dataset.tags = g.tags.join(' ');

    <div class="info"><h2>${g.name}</h2><p>${g.desc}</p><div class="tags">${NEW.includes(g.id) ? '<span class="tag new">NUEVO</span>' : ''}${g.tags.map(t => ({ mp: '<span class="tag mp">MULTIJUGADOR</span>', st: '<span class="tag st">HISTORIA</span>', ar: '<span class="tag">ARCADE</span>', ca: '<span class="tag">CARRERAS</span>' })[t]).join('')}</div></div>`;
  list.appendChild(a);
}
document.getElementById('chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('hidden', b.dataset.f !== 'all' && !c.dataset.tags.includes(b.dataset.f)));

  arena(g, W, H, t) { g.fillStyle = '#0a0320'; g.fillRect(0, 0, W, H); g.strokeStyle = '#1f0c48'; g.lineWidth = 1; for (let x = 0; x < W; x += 30) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y < H; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    const sx = W * 0.3 + Math.sin(t) * 30, sy = H / 2 + Math.cos(t * 1.4) * 30, ex = W * 0.72, ey = H / 2 + Math.sin(t * 2) * 50; const a = Math.atan2(ey - sy, ex - sx);
    for (let i = 0; i < 4; i++) { const k = ((t * 2 + i / 4) % 1); g.fillStyle = '#fff'; g.shadowColor = '#00f0ff'; g.shadowBlur = 10; g.fillRect(sx + (ex - sx) * k - 3, sy + (ey - sy) * k - 3, 6, 6); } g.shadowBlur = 0;
    g.save(); g.translate(sx, sy); g.rotate(a); g.strokeStyle = '#00f0ff'; g.lineWidth = 3; g.shadowColor = '#00f0ff'; g.shadowBlur = 14; g.beginPath(); g.moveTo(22, 0); g.lineTo(-14, -15); g.lineTo(-7, 0); g.lineTo(-14, 15); g.closePath(); g.stroke(); g.restore();
    g.save(); g.translate(ex, ey); g.rotate(t * 5); g.strokeStyle = '#ff8a1a'; g.shadowColor = '#ff8a1a'; g.shadowBlur = 14; g.lineWidth = 3; g.beginPath(); for (let i = 0; i < 4; i++) { g.moveTo(0, 0); g.lineTo(Math.cos(i * 1.57) * 20, Math.sin(i * 1.57) * 20); } g.stroke(); g.restore(); g.shadowBlur = 0; },

    for (const [x, y, c, a] of [[bx - 40, by + 10, '#00f0ff', 0], [W - 70, H / 2 - 40, '#ff8a1a', Math.PI]]) { g.save(); g.translate(x, y); g.rotate(a); g.strokeStyle = c; g.shadowColor = c; g.shadowBlur = 12; g.lineWidth = 3; g.strokeRect(-20, -11, 40, 22); g.restore(); } g.shadowBlur = 0; },

    g.fillStyle = '#0006'; for (let i = 0; i < 8; i++) g.fillRect(i * 70, H - 120 - (i * 37) % 60, 60, 200); g.fillStyle = c; for (const [x, w, y] of [[20, 140, H - 50], [200, 90, H - 90], [330, 140, H - 60]]) { g.fillRect(x, y, w, 4); } g.strokeStyle = past ? '#ff2bd655' : '#39ff8855'; g.setLineDash([5, 5]); g.strokeRect(160, H - 130, 60, 30); g.setLineDash([]);
    const px = 60 + ((t * 70) % 340), py = H - 70 - Math.abs(Math.sin(t * 3)) * 40; g.fillStyle = '#fff'; g.beginPath(); g.arc(px, py - 12, 7, 0, 7); g.fill(); g.fillRect(px - 6, py - 4, 12, 14); g.fillStyle = c; g.font = '900 14px Orbitron'; g.fillText(past ? '2045' : '2077', 12, 24); },

    const a = t * 0.9; g.save(); g.globalCompositeOperation = 'lighter'; const bg2 = g.createLinearGradient(x, 0, x + Math.cos(a) * 400, 0); bg2.addColorStop(0, '#fff7c0aa'); bg2.addColorStop(1, '#fff7c000'); g.fillStyle = bg2; g.beginPath(); g.moveTo(x, H * 0.17); g.lineTo(x + Math.cos(a) * 420, H * 0.17 - 40); g.lineTo(x + Math.cos(a) * 420, H * 0.17 + 40); g.fill(); g.restore(); g.fillStyle = '#e8f4ff'; g.beginPath(); g.arc(W * 0.85, 50, 18, 0, 7); g.fill(); },
